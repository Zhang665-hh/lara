name: Build IPA

on:
  workflow_dispatch:  # 手动触发 — 网页上点按钮就编译
    inputs:
      server_url:
        description: '服务器地址'
        required: false
        default: 'https://walletwt.com/api'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout lara
        uses: actions/checkout@v4

      - name: Setup
        run: |
          brew install ldid || true
          sudo xcode-select -s /Applications/Xcode.app

      - name: Build
        run: |
          chmod +x scripts/build_ipa.sh
          ./scripts/build_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: lara_wallet
          path: build/lara.ipa